
name: Bitcoin Prediction Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: bitcoin-prediction-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bitcoin prediction
        run: python main.py

      - name: Save prediction history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.csv paper_mean_reversion.csv
          git diff --cached --quiet || git commit -m "Update Bitcoin prediction history"
          git pull --rebase origin main
          git push origin HEAD:main
